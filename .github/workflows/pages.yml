name: Publicar sitio (GitHub Pages)

# El sitio se sirve desde la rama gh-pages. Este flujo la regenera con el
# contenido de main en cada cambio de la aplicación y comprueba que quedó en línea.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITIO: https://neonatologoscsm-eng.github.io/Neodosis-HSJD/

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p sitio
          cp index.html manifest.webmanifest sw.js sitio/
          cp -r css js assets sitio/
          touch sitio/.nojekyll

      - name: Publicar en la rama gh-pages
        run: |
          cd sitio
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sitio publicado desde ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

      - name: Comprobar que el sitio responde
        run: |
          for i in $(seq 1 30); do
            codigo=$(curl -sS -o pagina.html -w '%{http_code}' "$SITIO" || echo 000)
            if [ "$codigo" = "200" ] && grep -q "NeoDosis" pagina.html; then
              echo "✅ Sitio en línea: $SITIO"
              curl -sS -o /dev/null -w "  manifiesto: HTTP %{http_code}\n" "${SITIO}manifest.webmanifest"
              curl -sS -o /dev/null -w "  icono iOS:  HTTP %{http_code}\n" "${SITIO}assets/icono-ios-180.png"
              curl -sS -o /dev/null -w "  app.js:     HTTP %{http_code}\n" "${SITIO}js/app.js"
              exit 0
            fi
            echo "  intento $i: HTTP $codigo, reintentando…"
            sleep 20
          done
          echo "::error::El sitio no respondió 200 tras 10 minutos"
          exit 1
